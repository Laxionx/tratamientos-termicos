[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tratamientos"
version = "0.1.0"
description = "Tratamientos térmicos de fundiciones blancas y aceros, implementados desde la literatura"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Anthony Vera Baldeón" }]
dependencies = ["numpy", "pycalphad>=0.11"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff"]
app = ["scipy", "streamlit==1.65.0", "plotly==7.1.0"]

[tool.setuptools]
packages = ["tratamientos"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"app/textos_*.py" = ["E501"]  # son diccionarios de texto: una línea larga es una frase
